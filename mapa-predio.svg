    <path d="m905 144 10-9 10 9M905 157l10-9 10 9" fill="none" stroke="#76e4f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M838 170h41M838 290h41M838 410h41M838 530h41M838 650h41" fill="none" stroke="#536b88" stroke-width="2"/>
    <circle cx="879" cy="170" r="4" fill="#ecc77a"/>
    <circle cx="879" cy="290" r="4" fill="#6cdcc8"/>
    <circle cx="879" cy="410" r="4" fill="#b28cff"/>
    <circle cx="879" cy="530" r="4" fill="#81dfa5"/>
    <circle cx="879" cy="650" r="4" fill="#77c7ff"/>
    <g transform="translate(886 617)">
