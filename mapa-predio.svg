      <rect x="-4" y="6" width="76" height="8" rx="3" fill="#947340"/>
      <path d="M20 21v18M47 21v18" stroke="#e2c17f" stroke-opacity=".5"/>
      <path d="M15 0h12l-3 6h-6ZM44 0h12l-3 6h-6Z" fill="#e1b7d6"/>
    </g>
    <g transform="translate(742 145)">
