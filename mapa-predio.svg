      <ellipse cx="30" cy="25" rx="18" ry="10" fill="#4e3b41"/>
      <rect x="21" y="-1" width="18" height="8" rx="3" fill="#705c51"/>
      <rect x="21" y="44" width="18" height="8" rx="3" fill="#705c51"/>
    </g>
  </g>

