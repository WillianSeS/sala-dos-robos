      <rect x="7" y="23" width="44" height="42" rx="3" fill="url(#door)" stroke="#5b7794"/>
      <path d="M29 24v40" stroke="#8faac4"/>
      <text x="29" y="16" fill="#a6f3fa" font-size="10" font-weight="800" text-anchor="middle">40º</text>
    </g>
  </g>

  <g id="floor-show" class="floor" style="--accent:#ecc77a" tabindex="0" role="button" aria-pressed="false" aria-label="44º andar, Las Vegas Night. Palco, bar e mesas para assistir ao show.">
