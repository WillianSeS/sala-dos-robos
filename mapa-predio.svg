<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="group" aria-labelledby="building-map-title building-map-desc">
  <title id="building-map-title">Sala dos Robôs — mapa do sistema</title>
  <desc id="building-map-desc">Cinco andares ativos ligados por um elevador. O escritório fica no 40º andar; jogos no 41º; discoteca no 42º; lounge no 43º; e o show Las Vegas Night no 44º. A entrada pela fachada IA e Club leva ao escritório.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#081020"/><stop offset="1" stop-color="#101025"/></linearGradient>
    <linearGradient id="shaft" x2="1" y2="0"><stop stop-color="#1b2c42"/><stop offset=".5" stop-color="#111c32"/><stop offset="1" stop-color="#1b2c42"/></linearGradient>
    <linearGradient id="door" x2="0" y2="1"><stop stop-color="#324765"/><stop offset="1" stop-color="#172a42"/></linearGradient>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#7e3b70"/><stop offset="1" stop-color="#352d4c"/></linearGradient>
    <linearGradient id="floor-glow" x2="1" y2="0"><stop stop-color="#41d6e3" stop-opacity=".15"/><stop offset="1" stop-color="#a976ff" stop-opacity=".03"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7186b0" stroke-opacity=".04"/></pattern>
    <pattern id="dance" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#262246"/><rect width="12" height="12" fill="#6d3da5"/><rect x="12" y="12" width="12" height="12" fill="#317088"/></pattern>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .floor { cursor: pointer; outline: none; }
      .frame { fill: #101b2d; stroke: #28374d; stroke-width: 1.5; transition: stroke .18s, fill .18s; }
      .floor:hover .frame, .floor:focus .frame, .floor.is-selected .frame, .floor.floor-active .frame { stroke: var(--accent); fill: #18253a; }
      .floor-title { fill: #f3f7ff; font-size: 34px; font-weight: 750; letter-spacing: -.4px; }
      .floor-sub { fill: #b5c3d8; font-size: 22px; }
      .number { font-size: 32px; font-weight: 800; fill: var(--accent); }
      .mini-label { fill: #a9b9cd; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-anchor: middle; }
      .object-line { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1000" height="900" fill="url(#night)"/>
  <rect width="1000" height="900" fill="url(#grid)"/>
  <circle cx="975" cy="35" r="190" fill="#5939aa" opacity=".06"/>
  <circle cx="20" cy="890" r="235" fill="#1c92ac" opacity=".05"/>

  <!-- Marca e legenda do mapa. -->
  <g transform="translate(48 35)" fill="none" stroke="#6ceaf5" stroke-width="2" class="object-line">
    <rect x="0" y="3" width="43" height="35" rx="12" fill="#152b3e"/>
    <path d="M21.5 3v-6M-4 17v9M47 17v9"/>
    <circle cx="21.5" cy="-6" r="2.5" fill="#a781ff" stroke="none"/>
    <circle cx="13" cy="17" r="3" fill="#6ceaf5" stroke="none"/>
    <circle cx="30" cy="17" r="3" fill="#6ceaf5" stroke="none"/>
    <path d="M14 28h15"/>
  </g>
  <text x="111" y="58" fill="#f4f7ff" font-size="30" font-weight="850" letter-spacing="1.8">SALA DOS ROBÔS</text>
  <text x="111" y="81" fill="#8da2be" font-size="18" font-weight="650" letter-spacing="1.3">MAPA DO SISTEMA · 5 ANDARES ATIVOS</text>
  <rect x="698" y="38" width="140" height="30" rx="15" fill="#14332f" stroke="#2d6359"/>
  <circle cx="714" cy="53" r="4" fill="#6de5ba"/>
  <text x="727" y="58" fill="#a3e9d1" font-size="12" font-weight="700">Estrutura atual</text>
  <text x="915" y="105" fill="#95adc9" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">ELEVADOR</text>

  <!-- Um único eixo liga todos os andares. -->
  <g aria-label="Elevador ligando os cinco andares">
    <rect x="879" y="118" width="72" height="585" rx="17" fill="url(#shaft)" stroke="#496581" stroke-width="1.5"/>
    <path d="M891 135v550M939 135v550" stroke="#7394b4" stroke-opacity=".28" stroke-width="2"/>
